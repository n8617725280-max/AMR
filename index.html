.tw{overflow-x:auto}

   chunk.forEach(k=>{const [st,id]=k.split('|');const o=(D[st]||[]).find(x=>x.id===id);if(o){rows.push({store:st,id:id,data:o,updated_at:o._u||1});sent[k]=o._u}else delete M.dirty[k]});

   Object.keys(sent).forEach(k=>{const [st,id]=k.split('|');const o=D[st].find(x=>x.id===id);if(!o||o._u===sent[k])delete M.dirty[k]});
  }
  for(let loop=0;loop<200;loop++){
   const r=await sbFetch('records?since='+(M.lastPull||0)+'&limit=500');
   if(!r.ok)throw new Error('Download failed ('+r.status+')');
   const rows=await r.json();if(!rows.length)break;
   rows.forEach(row=>{const st=row.store;if(!D[st])return;const loc=D[st].find(x=>x.id===row.id);const o=row.data;const ru=o._u||row.updated_at;o._u=ru;if(!loc||(loc._u||0)<ru){if(st==='tokens'&&!loc&&o.status==='unpaid'&&o.date===ymd()&&(o.createdAt||0)>Date.now()-15*60000)newTk.push(o);upsert(st,o);idbPut(st,o);pulled++}if(row.updated_at>(M.lastPull||0))M.lastPull=row.updated_at});
   if(rows.length<500)break;
  }
  M.lastSync=Date.now();syncMsg='';applyShared();saveMeta();
  if(ME&&!D.users.find(u=>u.id===ME.id&&u.active!==false)){ME=null}
  else if(ME){ME=D.users.find(u=>u.id===ME.id)}
  if(manual)toast(pulled?('Synced. '+pulled+' new/updated records received.'):'Synced. Everything is up to date.');
  if(newTk.length&&ME&&can('tokens')){newTk.forEach(t=>toast('🔔 New token #'+t.no+' — '+t.name+' ('+t.doctorName+')'));beep()}
  if(pulled)refreshBadge();
  if(!ME)refreshLoginUsers();else if(pulled&&(page==='dashboard'||page==='tokens'))render();
 }catch(e){syncMsg='Sync error: '+(e.message||e);if(manual)toast(syncMsg,true);const lw=$('lwait');if(lw&&!M.lastSync)lw.textContent='Cannot reach the server. Check internet and reload this page.'}
 finally{syncing=false;saveMeta();renderStatus()}
}

function backupData(){return JSON.stringify({app:BRAND.app,v:1,ts:Date.now(),counters:M.counters,data:D})}
function doBackup(auto){download(BRAND.file+'_Backup_'+ymd()+'_'+new Date().toTimeString().slice(0,5).replace(':','')+'.json',backupData(),'application/json');M.lastBackup=Date.now();M.lastBackupDay=ymd();saveMeta();if(!auto){toast('Backup downloaded. Keep a copy on a pen drive too.');if(page==='backup')render()}}
function restoreFile(inp){
 const f=inp.files[0];if(!f)return;const rd=new FileReader();
 rd.onload=async()=>{
  let j;try{j=JSON.parse(rd.result)}catch(e){toast('This file is not a valid backup.',true);return}
  if(j.app!==BRAND.app||!j.data){toast('This is not a '+BRAND.name+' backup file.',true);return}
  const mode=(document.querySelector('input[name=rmode]:checked')||{}).value||'merge';
  const cnt=Object.keys(D).reduce((s,k)=>s+(j.data[k]||[]).length,0);
  if(!confirm((mode==='replace'?'REPLACE all data on this computer with':'MERGE')+' the backup of '+new Date(j.ts).toLocaleString()+' ('+cnt+' records)?'))return;
  for(const st of Object.keys(D)){
   if(mode==='replace'){D[st]=[];await idbClear(st)}
   (j.data[st]||[]).forEach(r=>{const loc=D[st].find(x=>x.id===r.id);if(!loc||(loc._u||0)<(r._u||0)||mode==='replace'){upsert(st,r);idbPut(st,r);M.dirty[st+'|'+r.id]=r._u||1}});
  }
  Object.keys(j.counters||{}).forEach(k=>{M.counters[k]=Math.max(M.counters[k]||0,j.counters[k])});
  saveMeta();log('Restore backup',f.name,mode+' · '+cnt+' records');toast('Backup restored.');schedSync();
  if(!D.users.find(u=>u.id===ME.id)){ME=null}else ME=D.users.find(u=>u.id===ME.id);render();
 };rd.readAsText(f);inp.value='';
}

const C39={'0':'nnnwwnwnn','1':'wnnwnnnnw','2':'nnwwnnnnw','3':'wnwwnnnnn','4':'nnnwwnnnw','5':'wnnwwnnnn','6':'nnwwwnnnn','7':'nnnwnnwnw','8':'wnnwnnwnn','9':'nnwwnnwnn','A':'wnnnnwnnw','B':'nnwnnwnnw','C':'wnwnnwnnn','D':'nnnnwwnnw','E':'wnnnwwnnn','F':'nnwnwwnnn','G':'nnnnnwwnw','H':'wnnnnwwnn','I':'nnwnnwwnn','J':'nnnnwwwnn','K':'wnnnnnnww','L':'nnwnnnnww','M':'wnwnnnnwn','N':'nnnnwnnww','O':'wnnnwnnwn','P':'nnwnwnnwn','Q':'nnnnnnwww','R':'wnnnnnwwn','S':'nnwnnnwwn','T':'nnnnwnwwn','U':'wwnnnnnnw','V':'nwwnnnnnw','W':'wwwnnnnnn','X':'nwnnwnnnw','Y':'wwnnwnnnn','Z':'nwwnwnnnn','-':'nwnnnnwnw','.':'wwnnnnwnn',' ':'nwwnnnwnn','*':'nwnnwnwnn','$':'nwnwnwnnn','/':'nwnwnnnwn','+':'nwnnnwnwn','%':'nnnwnwnwn'};

function saveBill(print){
 const t=F.type;
 if(!allowedTypes().includes(t))return toast('You cannot make this type of bill.',true);
 if(!F.name.trim())return toast('Enter the patient name.',true);
 if(t!=='LAB'&&!F.doc)return toast('Select the doctor.',true);
 if(hasLab(t)&&!F.items.length)return toast('Add at least one test.',true);
 const T=tot(F),paid=F.paidT?num(F.paid):T.net;
 if(paid<0||paid>T.net)return toast('Paid amount cannot be more than the net amount.',true);
 if(T.net<0)return toast('Total cannot be negative.',true);
 const dr=D.doctors.find(d=>d.id===F.doc),today=ymd();
 const pf={title:F.title,name:F.name.trim(),age:String(F.age).trim(),sex:F.sex,weight:String(F.weight).trim(),phone:F.phone.trim(),guardian:F.guardian.trim()};
 let p=F.pid?D.patients.find(x=>x.id===F.pid):null,newPt=false;
 if(p)p=Object.assign({},p,pf);else{p=Object.assign({id:uid(),pno:fmtPid(nextSeq('pat')),created:today},pf);newPt=true}
 put('patients',p);
 const snap={pid:p.id,pno:p.pno,title:pf.title,name:pf.name,age:pf.age,sex:pf.sex,weight:pf.weight,phone:pf.phone,guardian:pf.guardian,doctorId:dr?dr.id:'',doctorName:dr?dr.name:'SELF',doctorDeg:dr?dr.deg:'',doctorSpec:dr?dr.spec:'',apptDate:t==='LAB'?'':F.apptDate,apptTime:t==='LAB'?'':F.apptTime,items:F.items.map(i=>({tid:i.tid,n:i.n,r:num(i.r),del:i.del})),fee:T.fee,disc:T.disc,total:T.net,mode:F.mode,type:t};
 let b;
 if(F.edit){
  const old=D.bills.find(x=>x.id===F.edit);if(!old)return toast('Original bill not found.',true);
  b=Object.assign({},old,snap);b.bookingNo=F.bookingNo||old.bookingNo;
  const oldPaid=old.paid;b.pays=(old.pays||[]).slice();if(paid!==oldPaid)b.pays.push({d:today,a:paid-oldPaid,adj:1});
  b.paid=paid;b.due=T.net-paid;
  log('Edit bill',b.no,`total ${inr(old.total)}→${inr(T.net)}, paid ${inr(oldPaid)}→${inr(paid)}${old.name!==b.name?', name changed':''}`);
 }else{
  const no=`${S.billPrefix}-${S.dev}-${t==='OPD'?'OPD':t==='LAB'?'PT':'CB'}-${nextSeq('bill-'+t)}`;
  b=Object.assign({id:uid(),no,bookingNo:F.bookingNo||no,billDate:today,ts:Date.now(),createdBy:ME.name,newPt,pays:paid>0?[{d:today,a:paid}]:[],paid,due:T.net-paid},snap);
  log('Create bill',no,`${typeName(t)} · ₹${inr(T.net)}${newPt?' · new patient':''}`);
 }
 put('bills',b);
 const fromTk=!!F.tokenId;
 if(fromTk){const tk=D.tokens.find(x=>x.id===F.tokenId);if(tk&&tk.status==='unpaid'){put('tokens',Object.assign({},tk,{status:'billed',billNo:b.no,billId:b.id,billedBy:ME.name}));log('Token billed','Token '+tk.no,b.no)}}
 toast('Saved. Bill no. '+b.no);
 F=newForm(t);if(fromTk){page='tokens';render()}else if(page==='billing')drawBilling();
 if(print==='wa')waBill(b.id);else if(print)printBill(b,t==='OPD'?'slip':'receipt');
}

function setRange(k){const n=new Date();let f,t=ymd(n);
 if(k==='today')f=t;else if(k==='week'){const d=new Date(n);d.setDate(d.getDate()-((d.getDay()+6)%7));f=ymd(d)}
 else if(k==='month')f=ymd(new Date(n.getFullYear(),n.getMonth(),1));
 else{f=ymd(new Date(n.getFullYear(),n.getMonth()-1,1));t=ymd(new Date(n.getFullYear(),n.getMonth(),0))}
 RF={from:f,to:t};views.reports()}
views.reports=function(){
 if(!RF.from)RF={from:ymd(new Date(new Date().getFullYear(),new Date().getMonth(),1)),to:ymd()};
 $('view').innerHTML=`<div class="card"><div class="row"><label class="f">From<input type="date" value="${RF.from}" onchange="RF.from=this.value;drawReport()"></label><label class="f">To<input type="date" value="${RF.to}" onchange="RF.to=this.value;drawReport()"></label>
 <button class="btn l s" onclick="setRange('today')">Today</button><button class="btn l s" onclick="setRange('week')">This week</button><button class="btn l s" onclick="setRange('month')">This month</button><button class="btn l s" onclick="setRange('last')">Last month</button>
 <button class="btn g" style="margin-left:auto" onclick="exportCSV()">Download CSV (Excel)</button></div></div><div id="rep"></div>`;drawReport();
};
function drawReport(){
 const a=D.bills.filter(b=>!b._del&&b.billDate>=RF.from&&b.billDate<=RF.to);
 const pts=new Set(a.map(b=>b.pid)).size,newP=D.patients.filter(p=>p.created>=RF.from&&p.created<=RF.to).length;
 const opdB=a.filter(b=>b.doctorId&&b.type!=='LAB'),labB=a.filter(b=>b.type!=='OPD'&&b.items.length);
 const opdInc=opdB.reduce((s,b)=>s+b.fee,0),labInc=labB.reduce((s,b)=>s+b.items.reduce((x,i)=>x+num(i.r),0),0),disc=a.reduce((s,b)=>s+b.disc,0),billed=a.reduce((s,b)=>s+b.total,0),due=a.reduce((s,b)=>s+b.due,0),coll=collection(RF.from,RF.to);
 const days={};a.forEach(b=>{(days[b.billDate]=days[b.billDate]||[]).push(b)});
 const dayKeys=Object.keys(days).sort();
 const collByDay={};D.bills.forEach(b=>{if(b._del)return;(b.pays||[]).forEach(p=>{if(p.d>=RF.from&&p.d<=RF.to)collByDay[p.d]=(collByDay[p.d]||0)+p.a})});
 const allDays=[...new Set([...dayKeys,...Object.keys(collByDay)])].sort();
 const docRows=D.doctors.map(d=>{const x=opdB.filter(b=>b.doctorId===d.id);return{d,n:new Set(x.map(b=>b.pid)).size,bills:x.length,fee:x.reduce((s,b)=>s+b.fee,0)}}).filter(r=>r.bills).sort((x,y)=>y.fee-x.fee);
 const cats={};labB.forEach(b=>b.items.forEach(i=>{const c=cat(i.n);cats[c]=cats[c]||{n:0,amt:0};cats[c].n++;cats[c].amt+=num(i.r)}));
 const top={};labB.forEach(b=>b.items.forEach(i=>{top[i.n]=(top[i.n]||0)+1}));
 const topA=Object.entries(top).sort((x,y)=>y[1]-x[1]).slice(0,10);
 $('rep').innerHTML=`<div class="stats"><div class="stat s1"><b>${pts}</b><span>Patients</span></div><div class="stat s5"><b>${newP}</b><span>New patients</span></div><div class="stat s2"><b>${opdB.length}</b><span>OPD bills</span></div><div class="stat s3"><b>${labB.length}</b><span>Lab bills</span></div><div class="stat s4"><b>₹ ${inr(coll)}</b><span>Cash collected</span></div><div class="stat" style="background:#9a3b32"><b>₹ ${inr(due)}</b><span>Due on these bills</span></div></div>
 <div class="g3"><div class="card"><h2>Income</h2><div class="kv"><span>OPD fees</span><b>₹ ${inr(opdInc)}</b><span>Lab / X-ray / USG / ECG</span><b>₹ ${inr(labInc)}</b><span>Discount given</span><b>₹ ${inr(disc)}</b><span>Total billed</span><b>₹ ${inr(billed)}</b></div></div>
 <div class="card"><h2>Lab income by type</h2>${Object.keys(cats).length?`<table>${Object.entries(cats).map(([c,v])=>`<tr><td>${c}</td><td class="n">${v.n} tests</td><td class="n">₹ ${inr(v.amt)}</td></tr>`).join('')}</table>`:'<div class="em">No lab tests.</div>'}</div>
 <div class="card"><h2>Most done tests</h2>${topA.length?`<table>${topA.map(x=>`<tr><td>${esc(x[0])}</td><td class="n">${x[1]}</td></tr>`).join('')}</table>`:'<div class="em">No lab tests.</div>'}</div></div>
 <div class="card"><h2>Doctor-wise performance</h2>${docRows.length?`<div class="tw"><table><tr><th>Doctor</th><th class="n">Patients</th><th class="n">OPD bills</th><th class="n">OPD fees</th><th></th></tr>${docRows.map(r=>`<tr><td>${esc(r.d.name)}<br><span class="muted">${esc(r.d.spec)}</span></td><td class="n">${r.n}</td><td class="n">${r.bills}</td><td class="n">₹ ${inr(r.fee)}</td><td><button class="btn l s" onclick="BF={from:RF.from,to:RF.to,type:'',doc:'${r.d.id}',q:'',due:false};nav('bills')">Bills</button></td></tr>`).join('')}</table></div>`:'<div class="em">No OPD patients in this period.</div>'}</div>
 <div class="card"><h2>Day-wise</h2>${allDays.length?`<div class="tw"><table><tr><th>Date</th><th class="n">Patients</th><th class="n">Bills</th><th class="n">Billed</th><th class="n">Collected</th><th class="n">Due</th></tr>${allDays.map(k=>{const x=days[k]||[];return`<tr><td>${fd(k)}</td><td class="n">${new Set(x.map(b=>b.pid)).size}</td><td class="n">${x.length}</td><td class="n">${inr(x.reduce((s,b)=>s+b.total,0))}</td><td class="n">${inr(collByDay[k]||0)}</td><td class="n">${inr(x.reduce((s,b)=>s+b.due,0))}</td></tr>`}).join('')}</table></div>`:'<div class="em">No data in this period.</div>'}</div>`;
}
function exportCSV(){
 const a=D.bills.filter(b=>!b._del&&b.billDate>=RF.from&&b.billDate<=RF.to).sort((x,y)=>x.ts-y.ts);
 const h=['Bill No','Date','Time','Type','Patient ID','Patient','Age','Sex','Phone','Doctor','OPD Fee','Tests','Discount','Total','Paid','Due','Created By'];
 const rows=a.map(b=>[b.no,fd(b.billDate),ftShort(b.ts),typeName(b.type),b.pno,b.title+' '+b.name,b.age,b.sex,b.phone,b.doctorName,b.fee,b.items.map(i=>i.n).join('; '),b.disc,b.total,b.paid,b.due,b.createdBy]);
 download(BRAND.file+'_Bills_'+RF.from+'_to_'+RF.to+'.csv','\ufeff'+[h].concat(rows).map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv');log('Export CSV',RF.from+' to '+RF.to,a.length+' bills')}

/* ---------- images ---------- */
function imgFile(file,maxW,maxH,type,key,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,maxW/im.width,maxH/im.height),w=Math.max(1,Math.round(im.width*k)),h=Math.max(1,Math.round(im.height*k));const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');if(type==='jpeg'){x.fillStyle='#fff';x.fillRect(0,0,w,h)}x.drawImage(im,0,0,w,h);
 if(key){const d=x.getImageData(0,0,w,h),p=d.data;for(let i=0;i<p.length;i+=4){const l=(p[i]+p[i+1]+p[i+2])/3;if(l>225)p[i+3]=0;else if(l>170)p[i+3]=Math.round(255*(225-l)/55)}x.putImageData(d,0,0)}
 cb(c.toDataURL(type==='jpeg'?'image/jpeg':'image/png',.85))};im.src=r.result};r.readAsDataURL(file)}
function repImgUp(inp,key){const f=inp.files[0];if(!f)return;imgFile(f,1400,key==='repHeader'?320:260,'jpeg',false,d=>{S[key]=d;saveSettings();saveShared();toast('Image saved.');views.settings()})}
function repImgClear(key){S[key]='';saveSettings();saveShared();views.settings()}

function tplFor(testId,name){const t=D.tests.find(x=>x.id===testId);if(t&&t.rep&&t.rep.rows&&t.rep.rows.length)return t.rep;return RPTMAP[String(name).trim().toUpperCase()]||{dept:guessDept(name),rows:[R_(name,'','')],note:''}}
function rngResolve(r,sex){if(!r)return'';const m=String(r).match(/^M:(.*)\|F:(.*)$/);if(m)return(/^f/i.test(sex||'')?m[2]:m[1]).trim();return String(r)}
function rngParse(s){s=String(s||'').replace(/,/g,'');let m;if(/:/.test(s))return null;
 if((m=s.match(/^\s*<\s*=?\s*([\d.]+)/)))return{hi:+m[1]};if((m=s.match(/^\s*>\s*=?\s*([\d.]+)/)))return{lo:+m[1]};
 if((m=s.match(/^\s*\(?\s*([\d.]+)\s*(?:-|\u2013|to)\s*([\d.]+)/)))return{lo:+m[1],hi:+m[2]};return null}
function flagOf(v,range){v=String(v==null?'':v).trim();const x=parseFloat(v.replace(/,/g,''));if(!isFinite(x)||!/^[\d.,]+$/.test(v))return'';const p=rngParse(range);if(!p)return'';
 if(p.lo!==undefined&&p.hi!==undefined)return x<p.lo?'L':x>p.hi?'H':'';if(p.hi!==undefined)return x>=p.hi?'H':'';if(p.lo!==undefined)return x<=p.lo?'L':'';return''}

 <div class="row"><label class="f">Collection date<input type="date" value="${RP.collDate}" onchange="RP.collDate=this.value"></label><label class="f">Report date<input type="date" value="${RP.reportDate}" onchange="RP.reportDate=this.value"></label></div></div></div>
 ${RP.sections.map(secHTML).join('')}
 <div class="card"><div class="g2"><label class="f">Doctor / Pathologist (signs the report)${sel('pathologist','pathId')}</label><label class="f">Lab technician (Checked By)${sel('technician','techId')}</label><label class="f" style="grid-column:span 2">Test done by (machine / method line)<input value="${esc(RP.machine)}" oninput="RP.machine=this.value" placeholder="e.g. SEMI AUTO ANALYZER"></label></div>
 ${sg.length?'':'<div class="banner" style="margin-top:10px"><span>No signer added yet. Admin can add the doctor and technician in <b>Report Signers</b>.</span></div>'}
 <div class="mfoot" style="justify-content:flex-start"><button class="btn g" onclick="rpSave(true)">Finalize &amp; Print</button><button class="btn" onclick="rpSave(false)">Save draft</button><button class="btn l" onclick="rpPreview()">Preview</button><button class="btn l" onclick="nav('labreports')">Back</button></div></div>`};
function rpSave(final){
 const filled=RP.sections.some(s=>s.rows.some(r=>String(r.v).trim()));
 if(final&&!filled)return toast('Enter at least one result.',true);
 if(final&&!RP.pathId&&!confirm('No doctor is selected to sign. Print without a doctor signature?'))return;
 RP.status=final?'final':'draft';if(final){RP.finalBy=ME.name}RP.createdBy=RP.createdBy||ME.name;
 M.lastPath=RP.pathId;M.lastTech=RP.techId;saveMeta();
 put('reports',JSON.parse(JSON.stringify(RP)));log(final?'Report finalized':'Report draft saved',RP.billNo,RP.name);
 toast(final?'Report saved.':'Draft saved.');
 if(final){printHTML(reportHTML(RP),'report');setTimeout(()=>nav('labreports'),400)}
}
function rpPreview(){modal(`<h2>Preview</h2><div style="border:1px solid var(--ln);overflow:auto;padding:6px;background:#fff">${reportHTML(RP,true)}</div><div class="mfoot"><button class="btn l" onclick="closeModal()">Close</button></div>`,true)}
function repPrint(billId){const r=repOf(billId);if(r)printHTML(reportHTML(r),'report')}
function waReport(billId){const r=repOf(billId),b=D.bills.find(x=>x.id===billId);if(!r||!b)return;
 const L=['*'+S.clinicName+' '+S.sub+'*','LAB REPORT','Patient: '+r.title+' '+r.name+' ('+ageTxt(r.age)+', '+r.sex+')','Bill No: '+r.billNo,'Date: '+fd(r.reportDate),''];
 r.sections.forEach(s=>{L.push('*'+s.testName+'*');s.rows.forEach(x=>{if(String(x.v).trim()){const f=flagOf(x.v,x.r);L.push(x.n+': '+x.v+(x.u?' '+x.u:'')+(f?' ('+f+')':'')+(x.r?'  [Normal: '+x.r+']':''))}});L.push('')});
 const p=D.signers.find(s=>s.id===r.pathId);if(p)L.push('Reported by: '+p.name+(p.deg?', '+p.deg:''));L.push('Contact: '+S.recPhones);waOpen(b.phone,L)}

/* ---------- printed report ---------- */
function reportHTML(r,prev){
 const p=D.signers.find(s=>s.id===r.pathId),t=D.signers.find(s=>s.id===r.techId),ac=S.accent||'#1456a0',bar=S.barColor||'#1565c0';
 const head=S.repHeader?`<img src="${S.repHeader}" style="width:100%;display:block;margin-bottom:6px">`:`<div style="display:flex;gap:10px;align-items:center;margin-bottom:6px"><div style="width:70px;height:70px;flex:none">${logoHTML()}</div><div><div style="font-size:30px;font-weight:800;color:${ac};line-height:1.05">${esc(S.clinicName)} <span style="font-size:16px;font-weight:600;color:#444">${esc(S.sub)}</span></div><div style="font-size:11.5px">${esc(S.addr)}</div></div></div>`;
 const box=`<div class="rp-box"><table><tr><td class="k">Patient Name</td><td>${esc(r.title)} ${esc(String(r.name).toUpperCase())}</td><td class="k">Patient ID</td><td>${esc(r.pno)}</td></tr>
 <tr><td class="k">Patient Age</td><td>${esc(ageTxt(r.age))}</td><td class="k">Gender</td><td>${esc(String(r.sex||'').toUpperCase())}</td></tr>
 <tr><td class="k">Referring By</td><td colspan="3">${esc(r.refBy)}</td></tr>
 <tr><td class="k">Reg. Date</td><td>${fd(r.regDate)}</td><td class="k">Collection Date</td><td>${fd(r.collDate)}</td></tr>
 <tr><td class="k">Date Of Report</td><td>${fd(r.reportDate)}</td><td colspan="2" style="text-align:right">${barcode(r.billNo)}<div style="font-size:10px;text-align:right">${esc(r.billNo)}</div></td></tr></table></div>`;
 let lastDept=null,secs='';
 r.sections.forEach(s=>{const rows=s.rows.filter(x=>String(x.v).trim());if(!rows.length)return;const dp=String(s.dept).toUpperCase();
  if(dp!==lastDept){if(lastDept!==null)secs+='</tbody></table></div>';secs+=`<div class="rp-sec"><div class="rp-dept">DEPARTMENT OF ${esc(dp)}</div><table class="rp-t"><thead><tr><th style="width:40%">TEST NAME</th><th style="width:16%">RESULT</th><th style="width:12%">UNIT</th><th>NORMAL RANGE</th></tr></thead><tbody>`;lastDept=dp}
  rows.forEach(x=>{const f=flagOf(x.v,x.r);secs+=`<tr><td><div class="n">${esc(x.n)}</div>${x.sp?`<div class="s">Specimen : ${esc(x.sp)}</div>`:''}${x.me?`<div class="s">Method : ${esc(x.me)}</div>`:''}</td><td><b>${esc(x.v)}</b>${f?` <b>${f}</b>`:''}</td><td>${esc(x.u)}</td><td style="white-space:pre-line">${esc(x.r)}</td></tr>`});
  if(s.note)secs+=`<tr><td colspan="4" class="rp-note">NOTE:- ${esc(s.note)}</td></tr>`});
 if(lastDept!==null)secs+='</tbody></table></div>';
 const sig=(x,lbl)=>x?`<div class="rp-sig">${x.sig?`<img src="${x.sig}">`:'<div style="height:44px"></div>'}${lbl?`<div>${lbl}</div>`:''}<div style="font-weight:700">${esc(x.name)}</div>${x.deg?`<div>${esc(x.deg)}</div>`:''}${x.reg?`<div>${esc(x.reg)}</div>`:''}</div>`:'<div class="rp-sig"></div>';
 const foot=S.repFooter?`<img src="${S.repFooter}" style="width:100%;display:block">`:`<div style="text-align:center"><div style="font-size:24px;font-weight:800;color:${ac}">${esc(S.clinicName+' '+S.sub)}</div><div style="font-size:12px">\ud83d\udccd ${esc(S.addr)}</div><div style="font-size:12px">\u260e ${esc(S.recPhones)}${S.email?' &nbsp; \u2709 '+esc(S.email):''}</div></div>`;
 return `<div class="rp${prev?' prev':''}">${head}${box}${secs}
 ${r.machine?`<div class="rp-m">TEST DONE BY &nbsp;${esc(r.machine)}</div>`:''}
 ${S.repNB?`<div class="rp-m"><b>N.B:-</b> &nbsp;${esc(S.repNB)} &nbsp;&nbsp; ---------- <b>The end of Report</b> ----------</div>`:'<div class="rp-m" style="text-align:center">---------- The end of Report ----------</div>'}
 <div class="rp-sigs">${sig(t,'Checked By')}${sig(p,'')}</div>
 <div class="rp-foot">${foot}${S.repBar?`<div class="rp-bar" style="background:${bar}">${esc(S.repBar)}</div>`:''}</div></div>`}

/* ---------- import rates (admin) ---------- */
function rateImport(){modal(`<h2>Import rates</h2><p class="muted" style="margin-top:0">Paste lines like <b>CBC &nbsp; 300</b> (test name, then rate; tab, comma or space between). Copy two columns straight from Excel. Matching tests get the new rate; unknown names are added as new tests.</p><textarea id="ri_txt" rows="12" placeholder="CBC\t300\nBSF\t60\nLIPID PROFILE\t600"></textarea><div class="mfoot"><button class="btn l" onclick="closeModal()">Cancel</button><button class="btn g" onclick="rateImportGo()">Import</button></div>`,true)}
function rateImportGo(){const lines=$('ri_txt').value.split(/\r?\n/);let upd=0,add=0,bad=0;
 lines.forEach(l=>{l=l.trim();if(!l)return;let m=l.match(/^(.*?)[\t,;|]+\s*([\d.]+)\s*$/)||l.match(/^(.*\S)\s+([\d.]+)\s*$/);if(!m){bad++;return}
  const name=m[1].trim().replace(/^"|"$/g,''),rate=num(m[2]);if(!name)return;const t=D.tests.find(x=>nz(x.name)===nz(name));
  if(t){put('tests',Object.assign({},t,{rate,active:true}));upd++}else{put('tests',{id:'t'+uid(),name:name.toUpperCase(),rate,active:true});add++}});
 log('Rates imported','',upd+' updated, '+add+' added');closeModal();toast(upd+' rates updated, '+add+' tests added'+(bad?', '+bad+' lines skipped':'')+'.');views.tests()}

/* ---------- start ---------- */
async function init(){
 idb=await openDB();
 try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
 for(const s of ['doctors','tests','bills','patients','users','audit','tokens','reports','signers','config'])D[s]=await idbAll(s);
 const st=await idbAll('settings');S=Object.assign(defaultSettings(),st[0]||{});applyShared();
 const mt=await idbAll('meta');M=Object.assign({id:'meta',counters:{},dirty:{},lastPull:0,lastBackup:0,seeded:false,lastSync:0},mt[0]||{});
 if(M.syncV!==2){M.syncV=2;M.lastPull=0;saveMeta()}
 if(!M.seeded&&!D.users.length)seed();else if(!M.seeded){M.seeded=true;saveMeta()}
 if(!M.labSeeded){M.labSeeded=true;if(D.users.length&&!D.users.some(u=>u.role==='lab'))put('users',{id:'u-lab',name:'LAB',role:'lab',pin:hp('2222'),active:true});saveMeta()}
 saveSettings();
 let sid=null;try{sid=sessionStorage.getItem('glu')}catch(e){}
 ME=D.users.find(u=>u.id===sid&&u.active!==false)||null;
 window.addEventListener('online',()=>{renderStatus();syncNow()});window.addEventListener('offline',renderStatus);
 setInterval(()=>syncNow(),location.protocol==='file:'?30000:8000);
 render();syncNow();
}
init();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
